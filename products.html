<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Products & Services - 精选产品与服务</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 快捷跳转输入框轻量样式 */
        .page-jump-box {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0 10px;
        }
        .page-jump-input {
            width: 45px;
            height: 32px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .page-jump-input:focus {
            border-color: #0070f3;
        }
        .page-jump-btn {
            height: 32px;
            padding: 0 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .page-jump-btn:hover {
            background-color: #e0e0e0;
            border-color: #bbb;
        }

        /* 移动端响应式优化 */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: center;
                height: auto !important;
                padding: 10px 0 !important;
                position: static !important;
            }
            .navbar .logo {
                margin-bottom: 10px;
            }
            .main-nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                padding: 0;
            }
            .main-nav ul li {
                margin: 0;
            }
            .main-nav ul li a {
                font-size: 0.75rem;
                padding: 6px 8px;
            }

            .product-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .pagination-bar {
                flex-wrap: wrap;
                row-gap: 10px;
                justify-content: center;
            }
            .pagination-btn {
                padding: 8px 12px;
            }
            .page-jump-input {
                width: 40px;
            }

            .image-modal {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                align-items: center !important;
                justify-content: center !important;
                padding: 20px !important;
                box-sizing: border-box !important;
                z-index: 99999 !important;
            }
            .modal-content {
                max-width: 100% !important;
                max-height: 100% !important;
                object-fit: contain !important;
                margin: 0 auto !important;
            }
            .modal-close {
                top: 10px !important;
                right: 15px !important;
                font-size: 30px !important;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 { font-size: 1.5rem !important; }
            .page-header p { font-size: 0.85rem !important; }
            .product-card { padding: 10px !important; }
            .product-info h3 { font-size: 1rem; }
            .product-desc { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="src/images/logo.avif" alt="Logo">
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html#home">Home<br>首页</a></li>
                <li><a href="index.html#about">About Us<br>关于我们</a></li>
                
                <li class="dropdown">
                    <a href="catalog.html" class="dropbtn">Catalog<br>商品目录 <span class="arrow">&#x2228;</span></a>
                    <div class="dropdown-content">
                        <a href="catalog.html?category=keychain">Keychain<br>钥匙扣</a>
                        <a href="catalog.html?category=jewelry">Jewelry<br>首饰</a>
                        <a href="catalog.html?category=others">Others<br>其他</a>
                    </div>
                </li>

                <li><a href="products.html" class="active">Featured Products<br>精选产品</a></li>
                <li><a href="index.html#contact">Contact us<br>联系我们</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-header">
        <h1>Featured Products & Services<br>精选产品与服务</h1>
        <p>Customer Custom Cases<br>案例</p>
    </section>

    <section class="container">
        <div class="product-grid" id="caseGrid"></div>
        <div class="pagination-bar" style="margin-top: 30px; display: flex; justify-content: center; align-items: center;">
            <button id="prevBtn" class="pagination-btn disabled">&larr;</button>
            <span id="pageText" class="pagination-text">Page 1 of 1</span>
            <div class="page-jump-box">
                <input type="number" id="pageInput" class="page-jump-input" min="1" placeholder="Page">
                <button id="jumpBtn" class="page-jump-btn">√</button>
            </div>
            <button id="nextBtn" class="pagination-btn">&rarr;</button>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 xuqiec. All Rights Reserved.</p>
    </footer>

    <div id="imageModal" class="image-modal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImg">
        <div id="modalCaption" class="modal-caption"></div>
    </div>

    <script src="data/cases.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const ITEMS_PER_PAGE = 3;
            let currentPage = 1;
            const totalPages = Math.ceil(productsCaseData.length / ITEMS_PER_PAGE) || 1;

            const caseGrid = document.getElementById("caseGrid");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const pageText = document.getElementById("pageText");
            const pageInput = document.getElementById("pageInput");
            const jumpBtn = document.getElementById("jumpBtn");

            function renderPage(page) {
                caseGrid.innerHTML = "";
                const start = (page - 1) * ITEMS_PER_PAGE;
                const pageItems = productsCaseData.slice(start, start + ITEMS_PER_PAGE);

                pageItems.forEach(item => {
                    const cardHtml = `
                        <div class="product-card">
                            <div class="product-image">
                                <img src="src/images/product${item.id}${item.imageExt || '.jpg'}" alt="${item.titleCn}" loading="lazy" onerror="handleCaseImageError(this, 'product${item.id}')">
                            </div>
                            <div class="product-info">
                                <span class="product-tag">${item.tagEn}<br>${item.tagCn}</span>
                                <h3>${item.titleEn}<br>${item.titleCn}</h3>
                                <p class="product-desc">${item.descEn}<br>${item.descCn}</p>
                                <div class="product-footer">
                                    <span class="price">${item.originEn}<br>${item.originCn}</span>
                                    <a href="index.html#contact" class="btn-detail">Inquire for Details<br>咨询详情</a>
                                </div>
                            </div>
                        </div>
                    `;
                    caseGrid.insertAdjacentHTML("beforeend", cardHtml);
                });

                bindImageModal();
                pageText.textContent = `Page ${page} of ${totalPages}`;
                pageInput.max = totalPages;
                prevBtn.style.opacity = page <= 1 ? "0.4" : "1";
                prevBtn.style.cursor = page <= 1 ? "not-allowed" : "pointer";
                nextBtn.style.opacity = page >= totalPages ? "0.4" : "1";
                nextBtn.style.cursor = page >= totalPages ? "not-allowed" : "pointer";
            }

            function handleJump() {
                const targetPage = parseInt(pageInput.value);
                if (isNaN(targetPage)) return;
                if (targetPage < 1) currentPage = 1;
                else if (targetPage > totalPages) currentPage = totalPages;
                else currentPage = targetPage;
                pageInput.value = "";
                renderPage(currentPage);
            }

            jumpBtn.addEventListener("click", handleJump);
            pageInput.addEventListener("keydown", function(e) {
                if (e.key === "Enter") handleJump();
            });

            nextBtn.onclick = function() {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderPage(currentPage);
                }
            };
            prevBtn.onclick = function() {
                if (currentPage > 1) {
                    currentPage--;
                    renderPage(currentPage);
                }
            };

            function bindImageModal() {
                const modal = document.getElementById("imageModal");
                const modalImg = document.getElementById("modalImg");
                const captionText = document.getElementById("modalCaption");
                document.querySelectorAll(".product-image img").forEach(img => {
                    img.style.cursor = "zoom-in";
                    img.onclick = function() {
                        modal.style.display = "flex";
                        modalImg.src = this.src;
                        const card = this.closest(".product-card");
                        if (card) {
                            const title = card.querySelector("h3").innerText.replace('\n', ' ');
                            captionText.textContent = title;
                        }
                    };
                });
            }

            const modal = document.getElementById("imageModal");
            document.querySelector(".modal-close").onclick = () => modal.style.display = "none";
            modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

            renderPage(currentPage);
        });

        window.handleCaseImageError = function(img, base) {
            const exts = ['.jpg', '.jpeg', '.png', '.avif', '.webp', '.gif'];
            let index = parseInt(img.dataset.fallbackIndex || '-1');
            const currentSrc = img.getAttribute('src');
            const currentExt = currentSrc.substring(currentSrc.lastIndexOf('.')).toLowerCase();
            const currentIndex = exts.indexOf(currentExt);
            if (currentIndex !== -1) index = currentIndex;
            index++;
            if (index < exts.length) {
                img.dataset.fallbackIndex = index;
                img.src = `src/images/${base}${exts[index]}`;
            } else {
                img.onerror = null;
            }
        };
    </script>
</body>
</html>
